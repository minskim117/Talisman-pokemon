<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>포켓몬 부적공방</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 배경: 은은한 반짝이(app.js 가 채움) -->
  <div class="bg" aria-hidden="true">
    <div class="sky" id="sky"></div>
  </div>
  <main>
    <header>
      <!-- 금장 몬스터볼: 가는 금선 + 반투명 면 -->
      <svg class="ball" viewBox="0 0 100 100" width="68" height="68" aria-hidden="true">
        <defs>
          <linearGradient id="ballTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff1c6" /><stop offset="1" stop-color="#c9953f" />
          </linearGradient>
          <clipPath id="ballClip"><circle cx="50" cy="50" r="44" /></clipPath>
        </defs>
        <g clip-path="url(#ballClip)">
          <rect width="100" height="46" fill="url(#ballTop)" fill-opacity=".5" />
          <rect y="54" width="100" height="46" fill="#f0c66b" fill-opacity=".07" />
          <rect y="46" width="100" height="8" fill="#f0c66b" fill-opacity=".14" />
        </g>
        <g fill="none" stroke="#e2b866" stroke-width="1.2">
          <circle cx="50" cy="50" r="44" />
          <circle cx="50" cy="50" r="47.5" stroke-opacity=".4" stroke-width=".8" />
          <path d="M6 46H36M64 46H94M6 54H36M64 54H94" />
          <circle cx="50" cy="50" r="13" />
          <circle cx="50" cy="50" r="9.5" stroke-opacity=".5" stroke-width=".8" />
        </g>
        <circle cx="50" cy="50" r="13" fill="#f0c66b" fill-opacity=".1" />
        <path d="M50 44l6 6-6 6-6-6z" fill="#f0c66b" fill-opacity=".55" stroke="#fff1c6" stroke-width=".8" />
      </svg>
      <h1>포켓몬 부적공방</h1>
      <span class="divider" data-divider="sun"></span>
      <p class="lead">생년월일로 당신의 기운을 읽고,<br />필요한 부적을 그려드립니다.</p>
    </header>

    <form id="form" class="card frame">
      <div class="field">
        <label for="birthDate">생년월일 (양력)</label>
        <div class="datefield">
          <input type="text" id="birthDate" name="birthDate" required inputmode="numeric" autocomplete="bday"
            placeholder="YYYY-MM-DD" pattern="\d{4}-\d{2}-\d{2}" title="예: 1990-05-15" />
          <button type="button" id="calBtn" class="cal-btn" aria-label="달력 열기" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" />
            </svg>
          </button>
          <div id="picker" class="picker" role="dialog" aria-label="생년월일 선택" hidden></div>
        </div>
      </div>
      <div class="field">
        <label for="birthTime">태어난 시간 <em>(선택)</em></label>
        <div class="timefield">
          <input type="text" id="birthTime" name="birthTime" inputmode="numeric"
            placeholder="HH:MM" pattern="([01]\d|2[0-3]):[0-5]\d" title="예: 13:30" />
          <button type="button" id="timeBtn" class="cal-btn" aria-label="시간 선택 열기" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2" />
            </svg>
          </button>
          <div id="timePicker" class="picker" role="dialog" aria-label="태어난 시간 선택" hidden></div>
        </div>
      </div>
      <button type="submit" id="submit" class="btn-gold">부적 받기</button>
      <p id="error" class="error" hidden></p>
    </form>

    <section id="result" hidden>
      <div class="talisman-wrap">
        <div id="imageBox" class="image-box frame">
          <div class="loading"><span class="spinner"></span><p>지라치가 부적을 그리는 중</p></div>
        </div>
      </div>
      <article id="readingCard" class="card frame reading" hidden>
        <p class="hanja" id="rHanja"></p>
        <h2 id="rName"></h2>
        <span class="divider" data-divider="moon"></span>
        <h3>성격 풀이</h3>
        <p id="rPersonality"></p>
        <h3>기운 풀이</h3>
        <p id="rLacking"></p>
        <h3>부적의 힘</h3>
        <p id="rEffect"></p>
        <div class="guardian">
          <img id="pkImg" alt="" width="80" height="80" />
          <div>
            <small>수호 포켓몬 · 부족한 <b id="pkElement"></b> 기운</small>
            <strong id="pkName"></strong>
            <span id="pkTypes"></span>
            <p id="pkReason"></p>
          </div>
        </div>
        <span class="divider" data-divider="star"></span>
      </article>
      <div id="actions" class="actions" hidden>
        <a id="download" class="btn-line" download="talisman.png" hidden>부적 저장</a>
        <button type="button" id="saveCard" class="btn-line">풀이 저장</button>
        <button type="button" id="again" class="btn-line">다시 하기</button>
      </div>
    </section>

  </main>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
